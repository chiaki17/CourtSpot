name: Check Tennis Court

on:
  schedule:
    # ทุก 30 นาที ช่วง 09:00–22:00 เวลาไทย (UTC+7)
    # UTC: 01:00-15:00
    - cron: "0,30 2-15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: court-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO:  ${{ secrets.EMAIL_TO }}
          COURT_URL: https://court.ozzy.asia/court-demo
          STATE_FILE: state/notified.json
        run: python -m src.main

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add state/notified.json || true
          git diff --staged --quiet || git commit -m "chore: update notified state [skip ci]"
          git push